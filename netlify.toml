# Build command/publish directory are auto-detected by Netlify's Next.js
# Runtime (@netlify/plugin-nextjs) - intentionally not set here.

# Media upload/serve run as Edge Functions (Deno, streaming) instead of
# through Next.js API routes. Netlify's Next.js "edge runtime" actually
# executes in the regular Node function infra under the hood, not true
# streaming Edge Functions, so it would reintroduce the 6MB body limit
# that broke video uploads earlier in this project. Real Netlify Edge
# Functions genuinely stream and have no such limit.
[[edge_functions]]
  path = "/api/media-upload"
  function = "media-upload"

[[edge_functions]]
  path = "/api/media-serve"
  function = "media-serve"

# Netlify-native cache rules for admin-editable content pages — applied at
# Netlify's CDN/edge layer itself, ahead of and independent from whatever
# Cache-Control the Next.js app sets. This is a second, more authoritative
# layer against stale caching, since app-level headers in next.config.js
# alone haven't fully prevented repeat staleness on this project.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/news"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/article/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/gallery"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
