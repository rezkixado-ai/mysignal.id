[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # @libsql/client ships a native per-platform binary (e.g. @libsql/linux-x64-gnu).
  # esbuild's default bundling drops that binary, crashing every function that
  # imports it. Marking it external tells Netlify to include it from
  # node_modules as-is instead of bundling it.
  external_node_modules = ["@libsql/client"]

# Media upload/serve run as Edge Functions (Deno, streaming) instead of
# regular Functions because regular Functions cap request/response bodies
# around 6MB — too small for video. Edge Functions stream instead of
# buffering the whole file, so large video uploads work reliably.
[[edge_functions]]
  path = "/api/media-upload"
  function = "media-upload"

[[edge_functions]]
  path = "/api/media-serve"
  function = "media-serve"

# API routes -> functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
